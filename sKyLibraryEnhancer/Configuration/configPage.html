<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Template</title>
</head>
<body>
    <div id="TemplateConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="TemplateConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="IgnoreExtensions">Subtitle extensions</label>
                        <input id="IgnoreExtensions" name="IgnoreExtensions" type="text" is="emby-input" />
                        <div class="fieldDescription">Comma separated list of extensions that belong to subtitle files</div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="EnableNameBasedIgnore" name="EnableNameBasedIgnore" type="checkbox" is="emby-checkbox" />
                            <span>Whether folders shall be ignored if they contain any token below</span>
                        </label>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="IgnoreNames">Ignored folders</label>
                        <input id="IgnoreNames" name="IgnoreNames" type="text" is="emby-input" />
                        <div class="fieldDescription">Comma separated list of folders that contain ignored media (subtitles, audio tracks, etc)</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var TemplateConfig = {
                pluginUniqueId: '4b23ad66-7c21-4f2a-ab1c-4adea7fcb382'
            };

            document.querySelector('#TemplateConfigPage')
                .addEventListener('pageshow', function() {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(TemplateConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#IgnoreExtensions').value = config.IgnoreExtensions;
                        document.querySelector('#EnableNameBasedIgnore').checked = config.EnableNameBasedIgnore;
                        document.querySelector('#IgnoreNames').value = config.IgnoreNames;
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#TemplateConfigForm')
                .addEventListener('submit', function(e) {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(TemplateConfig.pluginUniqueId).then(function (config) {
                    config.IgnoreExtensions = document.querySelector('#IgnoreExtensions').value;
                    config.EnableNameBasedIgnore = document.querySelector('#EnableNameBasedIgnore').checked;
                    config.IgnoreNames = document.querySelector('#IgnoreNames').value;
                    ApiClient.updatePluginConfiguration(TemplateConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });

                e.preventDefault();
                return false;
            });
        </script>
    </div>
</body>
</html>
